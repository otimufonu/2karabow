<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>カラオケボウリング スコアマネージャー</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --panel-border: #333333;
      --text-main: #ffffff;
      --text-sub: #aaaaaa;
      --accent-cyan: #00f0ff;
      --accent-yellow: #ffea00;
      --accent-pink: #ff007f;
      --accent-green: #00ff66;
      --wheel-item-height: 44px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      touch-action: manipulation;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent-cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
      margin-bottom: 6px;
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn {
      background: #2a2a2a;
      color: var(--text-main);
      border: 1px solid var(--panel-border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:active {
      transform: scale(0.96);
      background: #333;
    }

    .btn-accent {
      background: var(--accent-cyan);
      color: #000;
      border: none;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .score-board {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .frames-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .frame-card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      position: relative;
    }

    .frame-card.active {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    .frame-num {
      font-size: 0.7rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .frame-score-box {
      font-size: 1.1rem;
      font-weight: bold;
      min-height: 24px;
      color: var(--accent-yellow);
    }

    .frame-song {
      font-size: 0.65rem;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
    }

    .summary-panel {
      background: var(--panel-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--panel-border);
      display: flex;
      justify-content: space-around;
      text-align: center;
      margin-bottom: 20px;
    }

    .summary-val {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--accent-cyan);
    }

    .summary-lbl {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    /* モーダル背景 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-content {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .modal-title {
      font-size: 1.2rem;
      color: var(--accent-cyan);
      margin-bottom: 16px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 6px;
      display: block;
    }

    .text-input {
      width: 100%;
      background: #121212;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .text-input:focus {
      border-color: var(--accent-cyan);
    }

    /* ----------------------------------------------------
       縦ホイール式ダイヤル UI (Wheel Picker) スタイル
    ---------------------------------------------------- */
    .dials-container {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin: 16px 0;
      background: #141414;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
    }

    .dial-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dial-header {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--accent-cyan);
      margin-bottom: 8px;
      text-align: center;
    }

    .wheel-wrapper {
      position: relative;
      width: 100%;
      height: 220px; /* 44px * 5行表示 */
      overflow: hidden;
      border-radius: 10px;
      background: #0a0a0a;
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.9);
      mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%, black 80%, transparent 100%);
    }

    /* 中央の選択枠ハイライト */
    .wheel-highlight {
      position: absolute;
      top: 88px; /* (220px - 44px) / 2 */
      left: 4px;
      right: 4px;
      height: 44px;
      border-top: 2px solid var(--accent-cyan);
      border-bottom: 2px solid var(--accent-cyan);
      background: rgba(0, 240, 255, 0.08);
      border-radius: 6px;
      pointer-events: none;
      z-index: 2;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .wheel-scroll-area {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none; /* Firefox */
      overscroll-behavior: contain;
      padding-top: 88px;   /* 先頭項目を中央にするための余白 */
      padding-bottom: 88px;/* 末尾項目を中央にするための余白 */
      box-sizing: border-box;
      touch-action: pan-y;
    }

    .wheel-scroll-area::-webkit-scrollbar {
      display: none; /* Chrome, Safari */
    }

    .wheel-item {
      height: 44px;
      line-height: 44px;
      text-align: center;
      scroll-snap-align: center;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-sub);
      opacity: 0.3;
      transform: scale(0.85);
      transition: all 0.12s ease-out;
      user-select: none;
      -webkit-user-select: none;
      cursor: pointer;
    }

    /* 中央のアクティブ表示 */
    .wheel-item.active {
      color: #ffffff;
      opacity: 1;
      font-size: 1.6rem;
      font-weight: 800;
      transform: scale(1.15);
      text-shadow: 0 0 12px var(--accent-cyan);
    }

    /* 前後の近接表示 */
    .wheel-item.near {
      color: #dddddd;
      opacity: 0.6;
      font-size: 1.15rem;
      transform: scale(0.95);
    }

    .wheel-item.far {
      color: #666666;
      opacity: 0.25;
      font-size: 0.9rem;
      transform: scale(0.8);
    }

    .cond-box {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-actions .btn {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>KARAOKE BOWLING</h1>
    <p style="font-size: 0.8rem; color: var(--text-sub);">精密採点 10フレームスコア計算</p>
  </header>

  <div class="top-controls">
    <button class="btn" onclick="resetAllScores()">リセット</button>
    <button class="btn" onclick="openRouletteModal()">ルーレット</button>
    <button class="btn" onclick="exportPDF()">PDF出力</button>
  </div>

  <main>
    <!-- スコアボード（10フレーム） -->
    <div class="score-board">
      <div class="frames-grid" id="framesGrid">
        <!-- JSで1〜10フレームを動的生成 -->
      </div>
    </div>

    <!-- 成績サマリー -->
    <div class="summary-panel">
      <div>
        <div class="summary-val" id="totalScore">0</div>
        <div class="summary-lbl">TOTAL SCORE</div>
      </div>
      <div>
        <div class="summary-val" id="strikeCount" style="color: var(--accent-yellow);">0</div>
        <div class="summary-lbl">STRIKES</div>
      </div>
      <div>
        <div class="summary-val" id="spareCount" style="color: var(--accent-pink);">0</div>
        <div class="summary-lbl">SPARES</div>
      </div>
    </div>
  </main>

  <!-- ====================================================
       スコア入力モーダル（縦ホイールUI組み込み）
  ==================================================== -->
  <div class="modal-overlay" id="inputModal">
    <div class="modal-content">
      <div class="modal-title" id="modalFrameTitle">第 1 フレーム スコア入力</div>

      <!-- 曲名入力欄 -->
      <div class="form-group">
        <label class="form-label" for="input-song-name">曲名（任意）</label>
        <input type="text" id="input-song-name" class="text-input" placeholder="曲名を入力...">
      </div>

      <!-- 縦ホイール式ダイヤル入力欄 -->
      <div class="dials-container">
        <!-- 素点ダイヤル -->
        <div class="dial-column">
          <div class="dial-header">素点</div>
          <div class="wheel-wrapper">
            <div class="wheel-highlight"></div>
            <div class="wheel-scroll-area" id="wheel-raw-score"></div>
          </div>
        </div>

        <!-- 全国平均ダイヤル -->
        <div class="dial-column">
          <div class="dial-header">全国平均</div>
          <div class="wheel-wrapper">
            <div class="wheel-highlight"></div>
            <div class="wheel-scroll-area" id="wheel-avg-score"></div>
          </div>
        </div>
      </div>

      <!-- 既存処理との互換用 (hidden input) -->
      <input type="hidden" id="input-raw-score" value="90">
      <input type="hidden" id="input-avg-score" value="85">

      <!-- 条件表示 -->
      <div class="cond-box" id="condDisplay">
        素点と全国平均の差分に基づいて、ストライク・スペア・ガーターなどの判定とボーナス点が自動計算されます。
      </div>

      <!-- モーダルボタン -->
      <div class="modal-actions">
        <button class="btn" onclick="closeInputModal()">キャンセル</button>
        <button class="btn btn-accent" onclick="saveFrameScore()">セット</button>
      </div>
    </div>
  </div>

  <script>
    /* ====================================================
       1. 縦ホイールUIクラス (WheelPicker)
    ==================================================== */
    class WheelPicker {
      constructor(containerId, options) {
        this.container = document.getElementById(containerId);
        this.min = options.min || 75;
        this.max = options.max || 100;
        this.initialValue = options.initialValue || 90;
        this.itemHeight = options.itemHeight || 44;
        this.onChange = options.onChange || function() {};
        this.selectedValue = this.initialValue;
        this.items = [];

        this.init();
      }

      init() {
        this.container.innerHTML = '';
        this.items = [];

        for (let val = this.min; val <= this.max; val++) {
          const item = document.createElement('div');
          item.className = 'wheel-item';
          item.textContent = val;
          item.dataset.value = val;

          // 数字タップ補助
          item.addEventListener('click', () => {
            this.setValue(val, true);
          });

          this.container.appendChild(item);
          this.items.push(item);
        }

        // スクロール時の状態更新
        this.container.addEventListener('scroll', () => {
          this.updateState();
        }, { passive: true });
      }

      updateState() {
        const scrollTop = this.container.scrollTop;
        const index = Math.round(scrollTop / this.itemHeight);
        const clampedIndex = Math.max(0, Math.min(this.items.length - 1, index));
        const selectedVal = this.min + clampedIndex;

        this.items.forEach((item, idx) => {
          const diff = Math.abs(idx - clampedIndex);
          item.classList.remove('active', 'near', 'far');
          if (diff === 0) {
            item.classList.add('active');
          } else if (diff === 1) {
            item.classList.add('near');
          } else {
            item.classList.add('far');
          }
        });

        if (this.selectedValue !== selectedVal) {
          this.selectedValue = selectedVal;
          this.onChange(this.selectedValue);
        }
      }

      setValue(value, animate = false) {
        const val = Math.max(this.min, Math.min(this.max, value));
        const index = val - this.min;
        const targetTop = index * this.itemHeight;

        this.container.scrollTo({
          top: targetTop,
          behavior: animate ? 'smooth' : 'auto'
        });

        this.selectedValue = val;
        this.updateState();
      }

      getValue() {
        return this.selectedValue;
      }
    }

    // ダイヤルインスタンス保持用変数
    let rawPicker, avgPicker;


    /* ====================================================
       2. 既存のゲームデータ構造 & 保存ロジック（変更禁止領域）
    ==================================================== */
    const TOTAL_FRAMES = 10;
    let currentFrameIndex = 0;

    let gameState = {
      frames: Array.from({ length: TOTAL_FRAMES }, () => ({
        songName: '',
        rawScore: 90,
        avgScore: 85,
        frameScore: 0,
        mark: '', // 'X' (Strike), '/' (Spare), '-' (Gutter)
        isSet: false
      }))
    };

    /* LocalStorage 復元 */
    function loadFromStorage() {
      const saved = localStorage.getItem('karaoke_bowling_state');
      if (saved) {
        try {
          gameState = JSON.parse(saved);
        } catch(e) {}
      }
    }

    function saveToStorage() {
      localStorage.setItem('karaoke_bowling_state', JSON.stringify(gameState));
    }


    /* ====================================================
       3. 既存の計算ロジック（calculateFrameResult / 変更禁止領域）
    ==================================================== */
    function calculateFrameResult(rawScore, avgScore) {
      const diff = rawScore - avgScore;
      let mark = '';
      let score = 0;

      // 計算ロジックルール
      if (rawScore >= 95 || diff >= 8) {
        mark = 'X'; // ストライク
        score = 30;
      } else if (diff >= 2) {
        mark = '/'; // スペア
        score = 18 + Math.floor(diff * 1.2);
      } else if (diff < -5) {
        mark = '-'; // ガーター
        score = Math.max(0, 5 + diff);
      } else {
        mark = '';
        score = Math.max(0, 10 + Math.floor(diff * 1.5));
      }

      return { score, mark, diff };
    }

    function recalculateAll() {
      let total = 0;
      let strikes = 0;
      let spares = 0;

      gameState.frames.forEach((f) => {
        if (f.isSet) {
          const res = calculateFrameResult(f.rawScore, f.avgScore);
          f.frameScore = res.score;
          f.mark = res.mark;
          total += res.score;

          if (res.mark === 'X') strikes++;
          if (res.mark === '/') spares++;
        } else {
          f.frameScore = 0;
          f.mark = '';
        }
      });

      document.getElementById('totalScore').textContent = total;
      document.getElementById('strikeCount').textContent = strikes;
      document.getElementById('spareCount').textContent = spares;

      renderGrid();
      saveToStorage();
    }


    /* ====================================================
       4. UI レンダリング & モーダル操作
    ==================================================== */
    function renderGrid() {
      const grid = document.getElementById('framesGrid');
      grid.innerHTML = '';

      gameState.frames.forEach((f, idx) => {
        const card = document.createElement('div');
        card.className = `frame-card ${idx === currentFrameIndex ? 'active' : ''}`;
        card.onclick = () => openInputModal(idx);

        const num = document.createElement('div');
        num.className = 'frame-num';
        num.textContent = `${idx + 1}F`;

        const scoreBox = document.createElement('div');
        scoreBox.className = 'frame-score-box';
        scoreBox.textContent = f.isSet ? (f.mark ? `${f.mark} (${f.frameScore})` : f.frameScore) : '-';

        const song = document.createElement('div');
        song.className = 'frame-song';
        song.textContent = f.isSet && f.songName ? f.songName : '未入力';

        card.appendChild(num);
        card.appendChild(scoreBox);
        card.appendChild(song);
        grid.appendChild(card);
      });
    }

    function openInputModal(frameIndex) {
      currentFrameIndex = frameIndex;
      const frameData = gameState.frames[frameIndex];

      document.getElementById('modalFrameTitle').textContent = `第 ${frameIndex + 1} フレーム スコア入力`;
      document.getElementById('input-song-name').value = frameData.songName || '';

      // 初期値の設定
      const initialRaw = frameData.isSet ? frameData.rawScore : 90;
      const initialAvg = frameData.isSet ? frameData.avgScore : 85;

      document.getElementById('input-raw-score').value = initialRaw;
      document.getElementById('input-avg-score').value = initialAvg;

      document.getElementById('inputModal').style.display = 'flex';

      // ダイヤルのスクロール位置合わせ（モーダル描画後に実行）
      requestAnimationFrame(() => {
        setTimeout(() => {
          if (rawPicker) rawPicker.setValue(initialRaw, false);
          if (avgPicker) avgPicker.setValue(initialAvg, false);
        }, 30);
      });
    }

    function closeInputModal() {
      document.getElementById('inputModal').style.display = 'none';
    }

    function saveFrameScore() {
      const songName = document.getElementById('input-song-name').value.trim();
      
      // ダイヤルから非表示入力欄に連動した値を取得
      const rawScore = parseInt(document.getElementById('input-raw-score').value, 10);
      const avgScore = parseInt(document.getElementById('input-avg-score').value, 10);

      gameState.frames[currentFrameIndex] = {
        songName,
        rawScore,
        avgScore,
        frameScore: 0,
        mark: '',
        isSet: true
      };

      recalculateAll();
      closeInputModal();
    }

    function resetAllScores() {
      if (confirm('すべてのスコアをリセットしますか？')) {
        gameState.frames = Array.from({ length: TOTAL_FRAMES }, () => ({
          songName: '',
          rawScore: 90,
          avgScore: 85,
          frameScore: 0,
          mark: '',
          isSet: false
        }));
        recalculateAll();
      }
    }

    function openRouletteModal() {
      alert('ルーレット機能: 次の選曲をランダムに決定します！');
    }

    function exportPDF() {
      alert('PDF出力機能: 現在のスコア表を印刷/保存用形式で作成します。');
    }


    /* ====================================================
       5. 初期化スクリプト
    ==================================================== */
    document.addEventListener('DOMContentLoaded', () => {
      loadFromStorage();

      // 素点ピッカー初期化 (範囲 75〜100, 初期値 90)
      rawPicker = new WheelPicker('wheel-raw-score', {
        min: 75,
        max: 100,
        initialValue: 90,
        onChange: (val) => {
          document.getElementById('input-raw-score').value = val;
        }
      });

      // 全国平均ピッカー初期化 (範囲 75〜100, 初期値 85)
      avgPicker = new WheelPicker('wheel-avg-score', {
        min: 75,
        max: 100,
        initialValue: 85,
        onChange: (val) => {
          document.getElementById('input-avg-score').value = val;
        }
      });

      recalculateAll();
    });
  </script>
</body>
</html>
