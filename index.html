<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>カラオケボウリング</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="カラオケボウリング">
  <!-- html2pdf.js (PDF出力用) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    /* ==========================================
       1. 基本設定・カラーテーマ（ダーク/ライト）
       ========================================== */
    :root {
      /* デフォルト（ダークモード） */
      --bg-color: #0b0d12;
      --card-bg: #161a22;
      --panel-bg: #1f2430;
      --accent-red: #ff2a5f;
      --accent-yellow: #ffc107;
      --accent-gold: #ffd700;
      --accent-cyan: #00e5ff;
      --accent-orange: #ff9800;
      --text-main: #ffffff;
      --text-sub: #a0a8b8;
      --border-color: #2a3142;
      --strike-color: #ff3b30;
      --spare-color: #34c759;
      --open-color: #007aff;

      /* UIパーツ別詳細カラー */
      --header-bg-top: #242936;
      --header-bg-bottom: #12151c;
      --btn-bg: #2a3142;
      --btn-text: #ffffff;
      --btn-border: #404b63;
      --th-bg: #10131a;
      --team-bg: #1a202c;
      --total-bg: #182232;
      --frame-bg: #12151d;
      --frame-active-bg: #252b3b;
      --frame-filled-bg: #1a1e29;
      --mark-bg: #232938;
      --reel-bg: #000000;
      --info-bg: #11151f;
      --modal-head-bg: #12151c;
      --input-bg: #0f1218;
      --input-border: #333a4d;
      --input-text: #ffffff;
      --wheel-bg: #0d1017;
      --wheel-near-color: #ffffff;
      --summary-bg: #11141c;

      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    [data-theme="light"] {
      /* ライトモード */
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --panel-bg: #ffffff;
      --accent-red: #e11d48;
      --accent-yellow: #d97706;
      --accent-gold: #b45309;
      --accent-cyan: #0284c7;
      --accent-orange: #ea580c;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --border-color: #cbd5e1;
      --strike-color: #dc2626;
      --spare-color: #16a34a;
      --open-color: #2563eb;

      --header-bg-top: #e2e8f0;
      --header-bg-bottom: #cbd5e1;
      --btn-bg: #e2e8f0;
      --btn-text: #1e293b;
      --btn-border: #94a3b8;
      --th-bg: #f8fafc;
      --team-bg: #f1f5f9;
      --total-bg: #e0f2fe;
      --frame-bg: #ffffff;
      --frame-active-bg: #bae6fd;
      --frame-filled-bg: #f8fafc;
      --mark-bg: #f1f5f9;
      --reel-bg: #1e293b;
      --info-bg: #e0f2fe;
      --modal-head-bg: #e2e8f0;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-text: #1e293b;
      --wheel-bg: #f8fafc;
      --wheel-near-color: #334155;
      --summary-bg: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow: hidden; /* スクロール禁止 */
      position: fixed;
    }

    /* モード制御表示ルール */
    body.controller-mode .display-only { display: none !important; }
    body.display-mode .controller-only { display: none !important; }

    #app-container {
      width: 100%;
      height: 100%;
      padding-top: var(--safe-top);
      padding-right: var(--safe-right);
      padding-bottom: var(--safe-bottom);
      padding-left: var(--safe-left);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ==========================================
       2. コントローラー画面 (スマホ縦画面向け)
       ========================================== */
    header {
      height: 42px;
      background: linear-gradient(180deg, var(--header-bg-top) 0%, var(--header-bg-bottom) 100%);
      border-bottom: 2px solid var(--accent-red);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      flex-shrink: 0;
    }

    .logo {
      font-weight: 900;
      font-size: 1.05rem;
      letter-spacing: 1px;
      background: linear-gradient(45deg, var(--accent-red), var(--accent-yellow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-badge {
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: bold;
      cursor: default;
      transition: all 0.15s ease;
    }

    .time-badge.result-ready {
      background: rgba(52, 199, 89, 0.15);
      border-color: var(--spare-color);
      color: var(--spare-color);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      animation: resultButtonPulse 1.8s ease-in-out infinite;
    }

    @keyframes resultButtonPulse {
      0%, 35%, 100% { box-shadow: 0 0 0 rgba(52, 199, 89, 0); }
      45% { box-shadow: 0 0 5px rgba(52, 199, 89, 0.45); }
    }

    .header-btns {
      display: flex;
      gap: 4px;
    }

    .btn {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: active 0.1s;
    }

    .btn:active { transform: scale(0.95); opacity: 0.8; }
    .btn-danger { background: #8b0000; border-color: var(--accent-red); color: #fff; }
    .btn-primary { background: #0055b8; border-color: var(--open-color); color: #fff; }
    .btn-success { background: #1b7a3e; border-color: var(--spare-color); color: #fff; }
    .btn-warning { background: #b75300; border-color: var(--accent-orange); color: #fff; }
    .btn-mode { background: #4a148c; border-color: #ab47bc; color: #fff; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 185px;
      gap: 6px;
      padding: 6px;
      min-height: 0;
      overflow: hidden;
    }

    @media (orientation: portrait) {
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }
    }

    .score-section {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
    }

    .score-table-wrapper {
      flex: 1;
      overflow-x: auto;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .score-table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .score-table th, .score-table td {
      border: 1px solid var(--border-color);
      text-align: center;
      vertical-align: middle;
      padding: 2px;
    }

    .score-table th {
      background: var(--th-bg);
      color: var(--text-sub);
      font-size: 0.75rem;
      height: 24px;
    }

    .team-name-cell {
      background: var(--team-bg);
      font-weight: bold;
      font-size: 0.82rem;
      color: var(--accent-yellow);
      width: 85px;
      word-break: break-all;
    }

    .total-score-cell {
      background: var(--total-bg);
      color: var(--accent-cyan);
      font-size: 1.05rem;
      font-weight: 900;
      width: 65px;
    }

    .frame-cell {
      background: var(--frame-bg);
      cursor: pointer;
      position: relative;
    }

    .frame-cell.active {
      outline: 2px solid var(--accent-yellow);
      background: var(--frame-active-bg) !important;
    }

    .frame-cell.filled { background: var(--frame-filled-bg); }

    .frame-box {
      display: flex;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
    }

    .frame-top {
      display: flex;
      border-bottom: 1px dashed var(--border-color);
      height: 50%;
      font-size: 0.68rem;
    }

    .raw-score-val {
      width: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sub);
    }

    .mark-val {
      width: 50%;
      background: var(--mark-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.75rem;
    }

    .mark-strike { color: var(--accent-red); }
    .mark-spare { color: var(--spare-color); }
    .mark-g { color: var(--text-sub); }

    .frame-bottom {
      height: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.85rem;
      color: var(--text-main);
    }

    .waiting-text { font-size: 0.65rem; color: #e6a23c; }

    .input-section {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 6px;
      gap: 4px;
      overflow: hidden;
    }

    .target-frame-info {
      font-size: 0.72rem;
      text-align: center;
      color: var(--accent-cyan);
      background: var(--info-bg);
      padding: 3px 4px;
      border-radius: 4px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .save-btn {
      width: 100%;
      padding: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: auto;
    }

    /* フッター選曲ルーレット */
    .roulette-footer {
      height: 48px;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      flex-shrink: 0;
    }

    .result-block {
      flex: 7;
      height: 100%;
      background: var(--reel-bg);
      border: 1px solid var(--accent-red);
      border-radius: 6px;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 0 8px;
    }

    .result-ticker-wrapper { width: 100%; overflow: hidden; white-space: nowrap; }
    .result-ticker-text { display: inline-block; font-size: 0.82rem; font-weight: bold; color: var(--accent-yellow); }
    .result-ticker-text.scroll { padding-left: 100%; animation: tickerScroll 12s linear infinite; }
    @keyframes tickerScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

    .roulette-btn, .reroll-btn {
      flex: 3;
      height: 100%;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 900;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .roulette-btn { background: linear-gradient(135deg, #ff2a5f 0%, #b3002d 100%); }
    .reroll-btn { background: linear-gradient(135deg, #ff9800 0%, #b56a00 100%); }

    /* ==========================================
       3. 観客画面 (16:9 外部ディスプレイ向け)
       ========================================== */
    body.display-mode #app-container {
      padding: 16px 24px;
      gap: 16px;
      background: #06080e;
    }

    .display-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, #1f2430 0%, #12151c 100%);
      padding: 12px 24px;
      border-radius: 12px;
      border-bottom: 3px solid var(--accent-red);
    }

    .display-logo {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(45deg, var(--accent-red), var(--accent-yellow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .display-current-banner {
      background: rgba(0, 229, 255, 0.08);
      border: 2px solid var(--accent-cyan);
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
    }

    .display-turn-info {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--accent-yellow);
    }

    .display-condition-info {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--text-main);
      text-align: right;
    }

    body.display-mode .score-table th {
      font-size: 1.25rem;
      height: 48px;
    }

    body.display-mode .team-name-cell {
      font-size: 1.6rem;
      width: 160px;
      padding: 8px;
    }

    body.display-mode .total-score-cell {
      font-size: 2.4rem;
      width: 120px;
    }

    body.display-mode .frame-top {
      font-size: 1.1rem;
      height: 45%;
    }

    body.display-mode .mark-val { font-size: 1.3rem; }
    body.display-mode .frame-bottom { font-size: 1.8rem; height: 55%; }

    /* 観客画面用結果オーバーレイ表示 */
    .display-result-card {
      background: rgba(22, 26, 34, 0.95);
      border: 3px solid var(--accent-gold);
      border-radius: 16px;
      padding: 24px;
      margin-top: 10px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
    }

    .display-result-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--accent-gold);
      margin-bottom: 16px;
    }

    .display-rank-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .display-rank-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--panel-bg);
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 1.8rem;
      font-weight: bold;
    }

    .display-rank-item.winner {
      border-color: var(--accent-gold);
      background: linear-gradient(90deg, rgba(255,215,0,0.15) 0%, rgba(22,26,34,1) 100%);
    }

    .display-diff-badge {
      font-size: 1.3rem;
      color: var(--accent-cyan);
      background: rgba(0, 229, 255, 0.15);
      padding: 4px 12px;
      border-radius: 20px;
      margin-left: 12px;
    }

    /* ==========================================
       4. ダイヤルUI・モーダル・演出
       ========================================== */
    .num-input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .wheel-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .wheel-label { color: var(--text-sub); font-size: 0.72rem; font-weight: bold; }
    .wheel-container {
      position: relative; width: 100%; height: 112px;
      background: var(--wheel-bg); border: 1px solid var(--border-color);
      border-radius: 6px; overflow: hidden; touch-action: none;
    }

    .wheel-highlight {
      position: absolute; top: 42px; left: 4px; right: 4px; height: 28px;
      border-top: 2px solid var(--accent-cyan); border-bottom: 2px solid var(--accent-cyan);
      background: rgba(0, 229, 255, 0.08); border-radius: 4px; pointer-events: none; z-index: 2;
    }

    .wheel-scroll { height: 100%; width: 100%; position: relative; }
    .wheel-item {
      position: absolute; left: 0; width: 100%; height: 28px; line-height: 28px;
      text-align: center; font-size: 0.8rem; color: var(--text-sub); opacity: 0;
      transition: transform 0.08s, opacity 0.08s, color 0.08s;
    }
    .wheel-item.selected { opacity: 1; color: var(--accent-cyan); font-size: 1.15rem; font-weight: 900; z-index: 3; }
    .wheel-item.near { opacity: 0.55; font-size: 0.92rem; color: var(--wheel-near-color); z-index: 1; }
    .wheel-item.far { opacity: 0.18; font-size: 0.78rem; z-index: 0; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85); display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 10px;
      width: 90%; max-width: 500px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-header { background: var(--modal-head-bg); padding: 10px 16px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); color: var(--accent-yellow); }
    .modal-body { padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.85rem; }
    .modal-footer { padding: 10px 14px; background: var(--modal-head-bg); display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--border-color); }
    .form-group { display: flex; flex-direction: column; gap: 2px; }
    .form-group label { color: var(--text-sub); font-size: 0.7rem; }
    .form-control { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--input-text); padding: 5px 6px; border-radius: 6px; font-size: 0.82rem; }

    .reel-window { width: 100%; min-height: 80px; background: var(--reel-bg); border: 2px solid var(--accent-red); border-radius: 6px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; }
    .reel-container { width: 100%; text-align: center; padding: 0 8px; }
    .reel-item { font-size: 1.05rem; font-weight: bold; color: var(--accent-yellow); word-break: break-all; }
    .reel-window.spinning .reel-container { animation: reelSpin 0.1s infinite linear; }
    @keyframes reelSpin { 0% { transform: translateY(-20px); opacity: 0.5; } 100% { transform: translateY(20px); opacity: 0.5; } }

    .breakdown-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; }
    .breakdown-table th, .breakdown-table td { border: 1px solid var(--border-color); padding: 4px 2px; text-align: center; }
    .breakdown-table th { background: var(--modal-head-bg); color: var(--accent-cyan); }

    /* 演出アニメーション */
    .effect-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999;
      pointer-events: none; display: flex; align-items: center; justify-content: center;
      opacity: 0; visibility: hidden; background: rgba(0, 0, 0, 0.75); transition: opacity 0.2s;
    }
    .effect-overlay.active { opacity: 1; visibility: visible; }
    .effect-burst { position: absolute; width: clamp(260px, 60vw, 480px); height: clamp(180px, 45vh, 320px); display: flex; align-items: center; justify-content: center; }
    .effect-text { position: relative; z-index: 2; font-size: clamp(2.5rem, 9vw, 5.5rem); font-weight: 900; letter-spacing: 2px; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }

    .effect-overlay.strike-anim .effect-burst {
      background: linear-gradient(135deg, #ff0055 0%, #ffcc00 100%);
      clip-path: polygon(50% 0%, 62% 14%, 80% 3%, 81% 22%, 99% 16%, 89% 34%, 100% 50%, 88% 66%, 97% 84%, 78% 79%, 74% 98%, 58% 86%, 45% 98%, 34% 84%, 17% 92%, 21% 74%, 2% 68%, 12% 51%, 0% 34%, 16% 25%, 9% 6%, 28% 15%);
      animation: strikeBurst 3s forwards;
    }
    .effect-overlay.strike-anim .effect-text { color: #fff; -webkit-text-stroke: 3px #8b0000; animation: strikeText 3s forwards; }

    .effect-overlay.spare-anim .effect-burst {
      background: linear-gradient(135deg, #00e676 0%, #cddc39 100%);
      clip-path: polygon(50% 0%, 65% 10%, 85% 5%, 82% 25%, 100% 35%, 88% 52%, 98% 70%, 78% 75%, 70% 95%, 50% 85%, 30% 95%, 22% 75%, 2% 70%, 12% 52%, 0% 35%, 18% 25%, 15% 5%, 35% 10%);
      animation: spareBurst 3s forwards;
    }
    .effect-overlay.spare-anim .effect-text { color: #fff; -webkit-text-stroke: 3px #1b5e20; animation: spareText 3s forwards; }

    @keyframes strikeBurst { 0% { transform: scale(4) rotate(-25deg); opacity: 0; } 15% { transform: scale(1) rotate(0deg); opacity: 1; } 80% { opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
    @keyframes strikeText { 0% { transform: scale(4) rotate(-25deg); opacity: 0; } 15% { transform: scale(1) rotate(0deg); opacity: 1; } 80% { opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
    @keyframes spareBurst { 0% { transform: translateY(100vh) scale(0.3); opacity: 0; } 20% { transform: translateY(0) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-100vh); opacity: 0; } }
    @keyframes spareText { 0% { transform: translateY(100vh) scale(0.3); opacity: 0; } 20% { transform: translateY(0) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-100vh); opacity: 0; } }
  </style>
</head>
<body class="controller-mode">

<div id="app-container">
  <!-- スマホ用コントローラーヘッダー -->
  <header class="controller-only">
    <div class="logo">🎤 丸美 カラオケボウリング</div>
    <div class="header-info">
      <button id="remaining-time" class="time-badge" onclick="openResultModal()" disabled>
        残り -- フレーム
      </button>
    </div>
    <div class="header-btns">
      <button class="btn btn-mode" onclick="toggleViewMode()">📺 観客画面</button>
      <button class="btn btn-danger" onclick="confirmClearScores()">クリア</button>
      <button class="btn" onclick="openSettingsModal()">設定</button>
      <button class="btn btn-primary" onclick="openBreakdownModal()">内訳</button>
    </div>
  </header>

  <!-- 観客画面専用ヘッダー＆状況バナー -->
  <div class="display-only display-header-bar">
    <div class="display-logo">🎤 KARAOKE BOWLING</div>
    <button class="btn btn-mode" style="font-size: 1rem; padding: 6px 14px;" onclick="toggleViewMode()">📱 コントローラーに戻る</button>
  </div>

  <div class="display-only display-current-banner">
    <div id="display-turn-info" class="display-turn-info">現在: 1曲目 - チームA</div>
    <div id="display-condition-info" class="display-condition-info">お題: 女性ボーカルの曲</div>
  </div>

  <!-- メインコンテンツ (スコア表 & 入力エリア) -->
  <main>
    <!-- スコア表 -->
    <section class="score-section">
      <div class="score-table-wrapper">
        <table class="score-table">
          <thead>
            <tr id="score-table-header">
              <th style="width: 85px;">チーム</th>
              <th style="width: 65px;">合計</th>
            </tr>
          </thead>
          <tbody id="score-table-body"></tbody>
        </table>
      </div>
    </section>

    <!-- スコア入力エリア (コントローラーモードでのみ表示) -->
    <section class="input-section controller-only">
      <div id="target-frame-display" class="target-frame-info">対象: 1曲目 - チーム1</div>
      
      <div class="form-group">
        <label>曲名 (任意):</label>
        <input type="text" id="input-song-title" class="form-control" placeholder="例: 残響散歌">
      </div>

      <!-- ダイヤルUI -->
      <div class="num-input-grid">
        <div class="wheel-group">
          <label class="wheel-label">素点</label>
          <div class="wheel-container">
            <div class="wheel-highlight"></div>
            <div class="wheel-scroll" id="wheel-scroll-raw"></div>
          </div>
          <input type="hidden" id="input-raw-score" value="90">
        </div>

        <div class="wheel-group">
          <label class="wheel-label">全国平均</label>
          <div class="wheel-container">
            <div class="wheel-highlight"></div>
            <div class="wheel-scroll" id="wheel-scroll-avg"></div>
          </div>
          <input type="hidden" id="input-avg-score" value="85">
        </div>
      </div>

      <button id="btn-save-score" class="btn btn-success save-btn" onclick="saveScoreInput()">セット</button>
    </section>

    <!-- 観客画面専用 最終順位表示エリア -->
    <section id="display-result-section" class="display-only display-result-card" style="display:none;">
      <div class="display-result-title">🏆 最終順位＆スコア結果</div>
      <div id="display-rank-list" class="display-rank-list"></div>
    </section>
  </main>

  <!-- 選曲条件フッター (コントローラーモードのみ) -->
  <footer class="roulette-footer controller-only">
    <div class="result-block">
      <div id="result-ticker-wrapper" class="result-ticker-wrapper">
        <div id="footer-condition-text" class="result-ticker-text">（条件未選択）</div>
      </div>
    </div>
    <button id="btn-spin-roulette" class="roulette-btn" onclick="openAndSpinRoulette()">回す</button>
    <button id="btn-reroll-roulette" class="reroll-btn" style="display:none;" onclick="openRerollModal()">引き直し</button>
  </footer>
</div>

<!-- モーダル各種 -->
<div id="roulette-modal" class="modal-overlay">
  <div class="modal-content" style="max-width: 440px;">
    <div class="modal-header">
      <span id="roulette-modal-title">🎰 選曲条件ルーレット</span>
      <span style="cursor:pointer;" onclick="closeModal('roulette-modal')">✕</span>
    </div>
    <div class="modal-body" style="padding: 20px 14px; text-align: center;">
      <div id="reel-window" class="reel-window">
        <div id="reel-container" class="reel-container">
          <div id="reel-text" class="reel-item">ルーレット回転中...</div>
        </div>
      </div>
    </div>
    <div class="modal-footer" style="justify-content: center;">
      <button id="btn-modal-spin-close" class="btn btn-primary" style="width: 100%; padding: 8px; font-size: 0.9rem; display: none;" onclick="closeModal('roulette-modal')">確定</button>
    </div>
  </div>
</div>

<div id="settings-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <span>ゲーム設定</span>
      <span style="cursor:pointer;" onclick="closeModal('settings-modal')">✕</span>
    </div>
    <div class="modal-body">
      <div class="num-input-grid">
        <div class="form-group">
          <label>チーム数 (1~5):</label>
          <input type="number" id="setting-team-count" class="form-control" min="1" max="5">
        </div>
        <div class="form-group">
          <label>1チームあたりの曲数 (1~10):</label>
          <input type="number" id="setting-song-count" class="form-control" min="1" max="10">
        </div>
      </div>
      <div class="form-group" style="margin-top: 4px;">
        <label>画面テーマ (配色):</label>
        <select id="setting-theme" class="form-control">
          <option value="dark">ダークモード</option>
          <option value="light">ライトモード</option>
        </select>
      </div>
      <div id="team-names-container" class="form-group" style="margin-top: 4px;"></div>
      <hr style="border-color: var(--border-color);">
      <div style="font-weight: bold; color: var(--accent-cyan); margin-top:4px;">ルール詳細設定</div>
      <div class="num-input-grid">
        <div class="form-group">
          <label>スペア判定差 (素点-平均 ≧ X):</label>
          <input type="number" step="1" id="setting-spare-diff" class="form-control">
        </div>
        <div class="form-group">
          <label>引き直しペナルティ:</label>
          <input type="number" step="1" id="setting-reroll-penalty" class="form-control">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('settings-modal')">キャンセル</button>
      <button class="btn btn-primary" onclick="saveSettings()">保存して戻る</button>
    </div>
  </div>
</div>

<div id="reroll-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <span>🎰 ルーレット引き直し確認</span>
      <span style="cursor:pointer;" onclick="closeModal('reroll-modal')">✕</span>
    </div>
    <div class="modal-body">
      <div id="reroll-confirm-msg" style="font-weight: bold; color: var(--accent-yellow); font-size: 0.95rem;">
        引き直すと -5ポイントになりますがよろしいですか？
      </div>
      <div class="form-group" style="margin-top: 8px;">
        <label>引き直すチームを選択してください:</label>
        <select id="reroll-team-select" class="form-control"></select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('reroll-modal')">キャンセル</button>
      <button class="btn btn-warning" onclick="executeReroll()">OK</button>
    </div>
  </div>
</div>

<div id="breakdown-modal" class="modal-overlay">
  <div class="modal-content" style="max-width: 700px; width: 95%;">
    <div class="modal-header">
      <span>スコア詳細内訳</span>
      <span style="cursor:pointer;" onclick="closeModal('breakdown-modal')">✕</span>
    </div>
    <div class="modal-body" id="breakdown-body"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('breakdown-modal')">閉じる</button>
    </div>
  </div>
</div>

<div id="result-modal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <span>🏆 最終計算結果</span>
      <span style="cursor:pointer;" onclick="closeModal('result-modal')">✕</span>
    </div>
    <div class="modal-body" id="result-body"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('result-modal')">閉じる</button>
    </div>
  </div>
</div>

<!-- 演出オーバーレイ -->
<div id="effect-overlay" class="effect-overlay">
  <div id="effect-burst" class="effect-burst"></div>
  <div id="effect-text" class="effect-text"></div>
</div>

<script>
  const STORAGE_KEY = "KARAOKE_BOWLING_DATA_V2";
  const SYNC_CHANNEL_NAME = "KARAOKE_BOWLING_SYNC";

  // マルチタブ・マルチウィンドウ（スマホ⇔PC外部画面）同期用チャンネル
  const syncChannel = new BroadcastChannel(SYNC_CHANNEL_NAME);

  const DEFAULT_CONDITIONS = [
    "「あ行」から始まるアーティストの曲",
    "アニメソング・特撮ソング",
    "2010年代以降にリリースされた曲",
    "バラード・ゆったりした曲",
    "タイトルが4文字以下の曲",
    "デュエットまたはコラボ曲",
    "男性ボーカルの曲",
    "女性ボーカルの曲",
    "自分が十八番（得意）としている曲",
    "全国平均が80点台の曲"
  ];

  let conditionsList = [...DEFAULT_CONDITIONS];

  let gameState = {
    settings: {
      teamCount: 2,
      songCount: 5,
      teamNames: ["チームA", "チームB"],
      spareDiff: 6,
      rerollPenalty: -5,
      finalStrikeBonus: 2,
      finalSpareBonus: 2,
      theme: "dark"
    },
    scores: [],
    rerollPenalties: [0, 0],
    frameConditions: [], // フレームごとの共通条件
    teamConditions: [],  // チーム別の引き直し条件 [teamIdx][songIdx]
    activeCell: { teamIdx: 0, songIdx: 0 },
    isFinished: false
  };

  let currentViewMode = "controller"; // "controller" or "display"

  /* ------------------------------------------
     状態同期 & 観客モード自動判定
     ------------------------------------------ */
  function autoDetectMode() {
    // 画面が横長（アスペクト比 1.3以上かつ幅768px以上）なら観客画面モードを提案・初期化
    const aspect = window.innerWidth / window.innerHeight;
    if (aspect > 1.3 && window.innerWidth >= 768) {
      return "display";
    }
    return "controller";
  }

  function setViewMode(mode) {
    currentViewMode = mode;
    if (mode === "display") {
      document.body.classList.remove("controller-mode");
      document.body.classList.add("display-mode");
    } else {
      document.body.classList.remove("display-mode");
      document.body.classList.add("controller-mode");
    }
    renderApp();
  }

  function toggleViewMode() {
    setViewMode(currentViewMode === "controller" ? "display" : "controller");
  }

  // 他画面（スマホでの操作等）からのブロードキャストを受信
  syncChannel.onmessage = (event) => {
    if (event.data && event.data.type === "STATE_UPDATE") {
      gameState = event.data.state;
      if (event.data.effect) {
        triggerEffect(event.data.effect);
      }
      applyTheme();
      renderApp();
      syncInputFormWithActiveCell();
    }
  };

  window.addEventListener("storage", (e) => {
    if (e.key === STORAGE_KEY && e.newValue) {
      gameState = JSON.parse(e.newValue);
      renderApp();
      syncInputFormWithActiveCell();
    }
  });

  /* ------------------------------------------
     ダイヤルUI制御
     ------------------------------------------ */
  const WHEEL_MIN = 75;
  const WHEEL_MAX = 100;
  const WHEEL_ITEM_HEIGHT = 28;
  const WHEEL_STEP_DISTANCE = 18;

  const wheelState = {
    raw: { value: 90, startY: 0, lastY: 0, accumulated: 0, dragging: false },
    avg: { value: 85, startY: 0, lastY: 0, accumulated: 0, dragging: false }
  };

  function initWheels() {
    setupWheel("raw");
    setupWheel("avg");
  }

  function setupWheel(type) {
    const container = document.getElementById(`wheel-scroll-${type}`);
    if (!container) return;

    container.innerHTML = "";
    for (let val = WHEEL_MIN; val <= WHEEL_MAX; val++) {
      const item = document.createElement("div");
      item.className = "wheel-item";
      item.dataset.value = val;
      item.textContent = val;
      container.appendChild(item);
    }

    const state = wheelState[type];

    container.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      state.dragging = true;
      state.startY = e.clientY;
      state.lastY = e.clientY;
      state.accumulated = 0;
      container.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    container.addEventListener("pointermove", (e) => {
      if (!state.dragging) return;
      const deltaY = e.clientY - state.lastY;
      state.lastY = e.clientY;
      state.accumulated += deltaY;

      while (state.accumulated <= -WHEEL_STEP_DISTANCE) {
        changeWheelValue(type, 1);
        state.accumulated += WHEEL_STEP_DISTANCE;
      }
      while (state.accumulated >= WHEEL_STEP_DISTANCE) {
        changeWheelValue(type, -1);
        state.accumulated -= WHEEL_STEP_DISTANCE;
      }
      e.preventDefault();
    });

    const endDrag = (e) => {
      if (!state.dragging) return;
      state.dragging = false;
      state.accumulated = 0;
      try { container.releasePointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
    };

    container.addEventListener("pointerup", endDrag);
    container.addEventListener("pointercancel", endDrag);
    renderWheel(type);
  }

  function changeWheelValue(type, amount) {
    const state = wheelState[type];
    const oldValue = state.value;
    state.value = Math.max(WHEEL_MIN, Math.min(WHEEL_MAX, state.value + amount));
    if (state.value === oldValue) return;

    const inputElem = document.getElementById(`input-${type}-score`);
    if (inputElem) inputElem.value = state.value;
    renderWheel(type);

    if (navigator.vibrate) navigator.vibrate(8);
  }

  function renderWheel(type) {
    const container = document.getElementById(`wheel-scroll-${type}`);
    const state = wheelState[type];
    if (!container) return;

    const items = container.querySelectorAll(".wheel-item");
    items.forEach((item) => {
      const val = parseInt(item.dataset.value, 10);
      const diff = val - state.value;
      item.classList.remove("selected", "near", "far");

      const centerY = 56;
      const itemCenter = centerY + (diff * WHEEL_ITEM_HEIGHT);
      item.style.top = `${itemCenter - WHEEL_ITEM_HEIGHT / 2}px`;

      if (diff === 0) item.classList.add("selected");
      else if (Math.abs(diff) === 1) item.classList.add("near");
      else if (Math.abs(diff) === 2) item.classList.add("far");
    });
  }

  function setWheelValue(type, val) {
    let num = parseInt(val, 10);
    if (isNaN(num)) num = type === "raw" ? 90 : 85;
    num = Math.max(WHEEL_MIN, Math.min(WHEEL_MAX, num));
    wheelState[type].value = num;

    const inputElem = document.getElementById(`input-${type}-score`);
    if (inputElem) inputElem.value = num;
    renderWheel(type);
  }

  /* ------------------------------------------
     基本処理 & データ管理
     ------------------------------------------ */
  function applyTheme() {
    const theme = (gameState.settings && gameState.settings.theme) ? gameState.settings.theme : "dark";
    document.documentElement.setAttribute("data-theme", theme);
  }

  window.addEventListener("DOMContentLoaded", async () => {
    initWheels();
    await fetchConditions();
    loadState();
    setViewMode(autoDetectMode());
    renderApp();
    syncInputFormWithActiveCell();
  });

  async function fetchConditions() {
    try {
      const res = await fetch("conditions.html");
      if (res.ok) {
        const text = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, "text/html");
        const items = Array.from(doc.querySelectorAll("li")).map(el => el.textContent.trim());
        if (items.length > 0) conditionsList = items;
      }
    } catch (e) {
      console.warn("初期条件セットを使用します", e);
    }
  }

  function loadState() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        gameState = { ...gameState, ...JSON.parse(saved) };
      } catch (e) {
        initEmptyScores();
      }
    } else {
      initEmptyScores();
    }
    ensureArrays();
    applyTheme();
  }

  function ensureArrays() {
    const { teamCount, songCount } = gameState.settings;
    if (!Array.isArray(gameState.rerollPenalties) || gameState.rerollPenalties.length !== teamCount) {
      gameState.rerollPenalties = Array(teamCount).fill(0);
    }
    if (!Array.isArray(gameState.frameConditions) || gameState.frameConditions.length !== songCount) {
      gameState.frameConditions = Array(songCount).fill(null);
    }
    if (!Array.isArray(gameState.teamConditions) || gameState.teamConditions.length !== teamCount) {
      gameState.teamConditions = Array.from({ length: teamCount }, () => Array(songCount).fill(null));
    }
  }

  function getEffectiveCondition(teamIdx, songIdx) {
    if (gameState.teamConditions && gameState.teamConditions[teamIdx] && gameState.teamConditions[teamIdx][songIdx]) {
      return { text: gameState.teamConditions[teamIdx][songIdx], isReroll: true };
    }
    if (gameState.frameConditions && gameState.frameConditions[songIdx]) {
      return { text: gameState.frameConditions[songIdx], isReroll: false };
    }
    return null;
  }

  function saveState(effectTrigger = null) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
    syncChannel.postMessage({
      type: "STATE_UPDATE",
      state: gameState,
      effect: effectTrigger
    });
  }

  function initEmptyScores() {
    const { teamCount, songCount } = gameState.settings;
    gameState.scores = Array.from({ length: teamCount }, () => Array(songCount).fill(null));
    gameState.rerollPenalties = Array(teamCount).fill(0);
    gameState.frameConditions = Array(songCount).fill(null);
    gameState.teamConditions = Array.from({ length: teamCount }, () => Array(songCount).fill(null));
    gameState.activeCell = { teamIdx: 0, songIdx: 0 };
    gameState.isFinished = false;
  }

  function calculateFrameResult(teamIdx, songIdx) {
    const frameData = gameState.scores[teamIdx][songIdx];
    if (!frameData) return null;

    const { rawScore, avgScore } = frameData;
    const diff = rawScore - avgScore;
    const isStrike = rawScore >= 90;
    const isSpare = !isStrike && (diff >= gameState.settings.spareDiff);
    const isLastSong = (songIdx === gameState.settings.songCount - 1);
    const nextFrame = isLastSong ? null : gameState.scores[teamIdx][songIdx + 1];

    let baseScore = rawScore + diff;
    let bonus = 0;
    let isWaiting = false;
    let mark = "OPEN";

    if (isStrike) {
      mark = "STRIKE";
      if (isLastSong) {
        bonus = diff * gameState.settings.finalStrikeBonus;
      } else {
        if (nextFrame) {
          bonus = (nextFrame.rawScore - nextFrame.avgScore) * 2;
        } else {
          isWaiting = true;
        }
      }
    } else if (isSpare) {
      mark = "SPARE";
      if (isLastSong) {
        bonus = diff * gameState.settings.finalSpareBonus;
      } else {
        if (nextFrame) {
          bonus = (nextFrame.rawScore - nextFrame.avgScore) * 1;
        } else {
          isWaiting = true;
        }
      }
    }

    const subtotal = isWaiting ? baseScore : (baseScore + bonus);
    const displayDiff = diff <= 0 ? "G" : `+${Math.round(diff)}`;

    return { rawScore, avgScore, diff, displayDiff, isStrike, isSpare, mark, baseScore, bonus, subtotal, isWaiting };
  }

  function renderApp() {
    renderHeaderInfo();
    renderScoreTable();
    renderRouletteTarget();
    updateFooterConditionDisplay();
    renderDisplayBanner();
    checkAutoFinished();
  }

  function renderHeaderInfo() {
    const { teamCount, songCount } = gameState.settings;
    let filledCount = 0;
    const totalFrames = teamCount * songCount;

    for (let t = 0; t < teamCount; t++) {
      for (let s = 0; s < songCount; s++) {
        if (gameState.scores[t][s]) filledCount++;
      }
    }

    const remainFrames = totalFrames - filledCount;
    const remainElem = document.getElementById("remaining-time");

    if (!remainElem) return;

    if (remainFrames === 0) {
      remainElem.textContent = "最終結果を表示";
      remainElem.classList.add("result-ready");
      remainElem.disabled = false;
      gameState.isFinished = true;
    } else {
      remainElem.textContent = `残り ${remainFrames} フレーム`;
      remainElem.classList.remove("result-ready");
      remainElem.disabled = true;
      gameState.isFinished = false;
    }
  }

  function renderScoreTable() {
    ensureArrays();
    const { teamCount, songCount, teamNames } = gameState.settings;
    const headerRow = document.getElementById("score-table-header");
    const tbody = document.getElementById("score-table-body");

    let headerHTML = `<th style="width: 85px;">チーム</th>`;
    for (let s = 0; s < songCount; s++) {
      headerHTML += `<th>${s + 1}曲目</th>`;
    }
    headerHTML += `<th style="width: 65px;">合計</th>`;
    headerRow.innerHTML = headerHTML;

    tbody.innerHTML = "";
    for (let t = 0; t < teamCount; t++) {
      const tr = document.createElement("tr");

      const teamTd = document.createElement("td");
      teamTd.className = "team-name-cell";
      teamTd.textContent = teamNames[t] || `チーム${t + 1}`;
      tr.appendChild(teamTd);

      let teamTotalScore = 0;

      for (let s = 0; s < songCount; s++) {
        const td = document.createElement("td");
        td.className = "frame-cell";
        if (t === gameState.activeCell.teamIdx && s === gameState.activeCell.songIdx) {
          td.classList.add("active");
        }

        const scoreData = gameState.scores[t][s];
        const res = calculateFrameResult(t, s);

        if (scoreData && res) {
          td.classList.add("filled");
          teamTotalScore += res.subtotal;

          let markClass = "";
          let markText = "";
          if (res.isStrike) { markClass = "mark-strike"; markText = "X"; }
          else if (res.isSpare) { markClass = "mark-spare"; markText = "/"; }
          else { markClass = "mark-g"; markText = res.diff <= 0 ? "G" : `${Math.round(res.diff)}`; }

          td.innerHTML = `
            <div class="frame-box" onclick="selectCell(${t}, ${s})">
              <div class="frame-top">
                <span class="raw-score-val">${Math.round(scoreData.rawScore)}</span>
                <span class="mark-val ${markClass}">${markText}</span>
              </div>
              <div class="frame-bottom">${res.isWaiting ? `<span class="waiting-text">待機</span>` : Math.round(res.subtotal)}</div>
            </div>
          `;
        } else {
          td.innerHTML = `
            <div class="frame-box" onclick="selectCell(${t}, ${s})">
              <div class="frame-top"><span class="raw-score-val">-</span><span class="mark-val"></span></div>
              <div class="frame-bottom">-</div>
            </div>
          `;
        }
        tr.appendChild(td);
      }

      const totalTd = document.createElement("td");
      totalTd.className = "total-score-cell";
      const penalty = gameState.rerollPenalties[t] || 0;
      totalTd.textContent = Math.round(teamTotalScore + penalty);
      tr.appendChild(totalTd);

      tbody.appendChild(tr);
    }
  }

  function renderRouletteTarget() {
    const { teamIdx, songIdx } = gameState.activeCell;
    const teamName = gameState.settings.teamNames[teamIdx] || `チーム${teamIdx + 1}`;
    document.getElementById("target-frame-display").textContent = `対象: ${songIdx + 1}曲目 - ${teamName}`;
  }

  function renderDisplayBanner() {
    const { teamIdx, songIdx } = gameState.activeCell;
    const teamName = gameState.settings.teamNames[teamIdx] || `チーム${teamIdx + 1}`;

    const turnElem = document.getElementById("display-turn-info");
    const condElem = document.getElementById("display-condition-info");

    if (turnElem) turnElem.textContent = `現在: 第${songIdx + 1}曲目 - ${teamName}`;

    const eff = getEffectiveCondition(teamIdx, songIdx);
    if (condElem) {
      if (eff) {
        condElem.textContent = `お題: ${eff.text} ${eff.isReroll ? '（引き直し適用）' : ''}`;
      } else {
        condElem.textContent = `お題: 未選択（ルーレットを回してください）`;
      }
    }
  }

  function updateFooterConditionDisplay() {
    const elem = document.getElementById("footer-condition-text");
    const btnSpin = document.getElementById("btn-spin-roulette");
    const btnReroll = document.getElementById("btn-reroll-roulette");

    if (!elem) return;

    const { teamIdx, songIdx } = gameState.activeCell;
    ensureArrays();

    const baseCond = gameState.frameConditions[songIdx];
    const teamCond = gameState.teamConditions[teamIdx] ? gameState.teamConditions[teamIdx][songIdx] : null;

    const teamName = gameState.settings.teamNames[teamIdx] || `チーム${teamIdx + 1}`;
    const penaltyVal = gameState.settings.rerollPenalty || -5;

    if (!baseCond) {
      elem.textContent = `【第${songIdx + 1}曲目】基本条件は未決定です（「回す」を押してください）`;
      if (btnSpin) btnSpin.style.display = "flex";
      if (btnReroll) btnReroll.style.display = "none";
    } else {
      if (teamCond) {
        elem.textContent = `【第${songIdx + 1}曲目 / ${teamName}専用】${teamCond}`;
      } else {
        elem.textContent = `【第${songIdx + 1}曲目 共通条件】${baseCond}`;
      }
      if (btnSpin) btnSpin.style.display = "none";
      if (btnReroll) {
        btnReroll.style.display = "flex";
        btnReroll.textContent = `引き直し (${penaltyVal})`;
      }
    }
  }

  function selectCell(teamIdx, songIdx) {
    gameState.activeCell = { teamIdx, songIdx };
    renderApp();
    syncInputFormWithActiveCell();
  }

  function syncInputFormWithActiveCell() {
    const { teamIdx, songIdx } = gameState.activeCell;
    const existing = gameState.scores[teamIdx][songIdx];
    const titleInput = document.getElementById("input-song-title");

    if (existing) {
      if (titleInput) titleInput.value = existing.title || "";
      setWheelValue('raw', existing.rawScore);
      setWheelValue('avg', existing.avgScore);
    } else {
      if (titleInput) titleInput.value = "";
      setWheelValue('raw', 90);
      setWheelValue('avg', 85);
    }
  }

  function saveScoreInput() {
    const rawVal = parseFloat(document.getElementById("input-raw-score").value);
    const avgVal = parseFloat(document.getElementById("input-avg-score").value);
    const titleVal = document.getElementById("input-song-title").value.trim();

    if (isNaN(rawVal) || isNaN(avgVal)) return;

    const { teamIdx, songIdx } = gameState.activeCell;
    const eff = getEffectiveCondition(teamIdx, songIdx);

    gameState.scores[teamIdx][songIdx] = {
      rawScore: Math.round(rawVal),
      avgScore: Math.round(avgVal),
      title: titleVal,
      condition: eff ? eff.text : "（条件未指定）"
    };

    const res = calculateFrameResult(teamIdx, songIdx);
    let effectTrigger = null;

    if (res) {
      if (res.isStrike) effectTrigger = "strike";
      else if (res.isSpare) effectTrigger = "spare";
    }

    advanceToNextUnfilledCell();
    saveState(effectTrigger);
    renderApp();
    syncInputFormWithActiveCell();

    if (effectTrigger) triggerEffect(effectTrigger);
  }

  let effectTimer = null;
  function triggerEffect(type) {
    const overlay = document.getElementById("effect-overlay");
    const textElem = document.getElementById("effect-text");
    if (!overlay || !textElem) return;

    clearTimeout(effectTimer);
    overlay.className = "effect-overlay";
    void overlay.offsetWidth;

    if (type === "strike") {
      textElem.textContent = "STRIKE!!";
      overlay.classList.add("strike-anim", "active");
    } else if (type === "spare") {
      textElem.textContent = "SPARE!";
      overlay.classList.add("spare-anim", "active");
    }

    effectTimer = setTimeout(() => { overlay.className = "effect-overlay"; }, 3000);
  }

  function advanceToNextUnfilledCell() {
    const { teamCount, songCount } = gameState.settings;
    for (let s = 0; s < songCount; s++) {
      for (let t = 0; t < teamCount; t++) {
        if (!gameState.scores[t][s]) {
          gameState.activeCell = { teamIdx: t, songIdx: s };
          return;
        }
      }
    }
  }

  /* ------------------------------------------
     ルーレット＆引き直し制御
     ------------------------------------------ */
  let isSpinning = false;
  let currentSpinContext = { mode: "base", teamIdx: 0, songIdx: 0 };

  function openAndSpinRoulette() {
    const { songIdx, teamIdx } = gameState.activeCell;
    ensureArrays();

    if (gameState.frameConditions[songIdx]) return;

    currentSpinContext = { mode: "base", teamIdx, songIdx };
    document.getElementById("roulette-modal-title").textContent = `🎰 第${songIdx + 1}曲目 共通条件ルーレット`;

    openModal("roulette-modal");
    runRouletteSpinInModal();
  }

  function runRouletteSpinInModal() {
    if (isSpinning) return;
    isSpinning = true;

    const reelWindow = document.getElementById("reel-window");
    const reelText = document.getElementById("reel-text");
    const closeBtn = document.getElementById("btn-modal-spin-close");
    if (closeBtn) closeBtn.style.display = "none";
    if (reelWindow) reelWindow.classList.add("spinning");

    let counter = 0;
    const interval = setInterval(() => {
      reelText.textContent = conditionsList[Math.floor(Math.random() * conditionsList.length)];
      counter++;

      if (counter > 18) {
        clearInterval(interval);
        if (reelWindow) reelWindow.classList.remove("spinning");
        const finalSelected = conditionsList[Math.floor(Math.random() * conditionsList.length)];
        reelText.textContent = finalSelected;

        ensureArrays();
        if (currentSpinContext.mode === "base") {
          gameState.frameConditions[currentSpinContext.songIdx] = finalSelected;
        } else {
          gameState.teamConditions[currentSpinContext.teamIdx][currentSpinContext.songIdx] = finalSelected;
        }

        isSpinning = false;
        saveState();
        renderApp();
        if (closeBtn) closeBtn.style.display = "block";
      }
    }, 80);
  }

  function openRerollModal() {
    ensureArrays();
    const { teamIdx, songIdx } = gameState.activeCell;
    const baseCond = gameState.frameConditions[songIdx];

    if (!baseCond) return;

    const penalty = gameState.settings.rerollPenalty || -5;
    document.getElementById("reroll-confirm-msg").textContent = `引き直すと ${penalty}ポイントのペナルティが適用されます。`;

    const selectElem = document.getElementById("reroll-team-select");
    selectElem.innerHTML = "";

    const { teamCount, teamNames } = gameState.settings;
    for (let t = 0; t < teamCount; t++) {
      const opt = document.createElement("option");
      opt.value = t;
      opt.textContent = teamNames[t] || `チーム${t + 1}`;
      if (t === teamIdx) opt.selected = true;
      selectElem.appendChild(opt);
    }

    openModal("reroll-modal");
  }

  function executeReroll() {
    const selectElem = document.getElementById("reroll-team-select");
    const selectedTeamIdx = parseInt(selectElem.value, 10);

    ensureArrays();
    const penalty = gameState.settings.rerollPenalty || -5;
    gameState.rerollPenalties[selectedTeamIdx] = (gameState.rerollPenalties[selectedTeamIdx] || 0) + penalty;

    currentSpinContext = {
      mode: "reroll",
      teamIdx: selectedTeamIdx,
      songIdx: gameState.activeCell.songIdx
    };

    closeModal("reroll-modal");

    const teamName = gameState.settings.teamNames[selectedTeamIdx] || `チーム${selectedTeamIdx + 1}`;
    document.getElementById("roulette-modal-title").textContent = `🎰 引き直しお題抽選 (${teamName})`;

    openModal("roulette-modal");
    runRouletteSpinInModal();
  }

  /* ------------------------------------------
     設定・モーダル・結果画面
     ------------------------------------------ */
  function openSettingsModal() {
    const { teamCount, songCount, teamNames, spareDiff, rerollPenalty, theme } = gameState.settings;
    document.getElementById("setting-team-count").value = teamCount;
    document.getElementById("setting-song-count").value = songCount;
    document.getElementById("setting-spare-diff").value = spareDiff;
    document.getElementById("setting-reroll-penalty").value = rerollPenalty;
    document.getElementById("setting-theme").value = theme || "dark";

    renderTeamNameInputs(teamCount, teamNames);

    document.getElementById("setting-team-count").onchange = (e) => {
      const newCount = Math.min(5, Math.max(1, parseInt(e.target.value) || 1));
      renderTeamNameInputs(newCount, teamNames);
    };

    openModal("settings-modal");
  }

  function renderTeamNameInputs(count, existingNames) {
    const container = document.getElementById("team-names-container");
    container.innerHTML = "<label>チーム名:</label>";
    for (let i = 0; i < count; i++) {
      const input = document.createElement("input");
      input.type = "text";
      input.className = "form-control team-name-input";
      input.style.marginBottom = "4px";
      input.value = existingNames[i] || `チーム${String.fromCharCode(65 + i)}`;
      container.appendChild(input);
    }
  }

  function saveSettings() {
    const newTeamCount = parseInt(document.getElementById("setting-team-count").value);
    const newSongCount = parseInt(document.getElementById("setting-song-count").value);
    const newSpareDiff = parseFloat(document.getElementById("setting-spare-diff").value);
    const newRerollPenalty = parseFloat(document.getElementById("setting-reroll-penalty").value);
    const newTheme = document.getElementById("setting-theme").value;

    const nameInputs = document.querySelectorAll(".team-name-input");
    const newTeamNames = Array.from(nameInputs).map((inp, idx) => inp.value.trim() || `チーム${idx + 1}`);

    gameState.settings = {
      ...gameState.settings,
      teamCount: newTeamCount,
      songCount: newSongCount,
      teamNames: newTeamNames,
      spareDiff: newSpareDiff,
      rerollPenalty: newRerollPenalty,
      theme: newTheme
    };

    initEmptyScores();
    applyTheme();
    saveState();
    closeModal("settings-modal");
    renderApp();
    syncInputFormWithActiveCell();
  }

  function confirmClearScores() {
    if (confirm("入力データをクリアして初期化しますか？")) {
      initEmptyScores();
      saveState();
      renderApp();
      syncInputFormWithActiveCell();
    }
  }

  function checkAutoFinished() {
    const section = document.getElementById("display-result-section");
    if (!section) return;

    if (gameState.isFinished) {
      section.style.display = "block";
      renderRankingsToElement("display-rank-list");
    } else {
      section.style.display = "none";
    }
  }

  function renderRankingsToElement(targetId) {
    const container = document.getElementById(targetId);
    if (!container) return;

    const { teamCount, teamNames, songCount } = gameState.settings;
    const results = [];

    for (let t = 0; t < teamCount; t++) {
      let total = 0;
      for (let s = 0; s < songCount; s++) {
        const res = calculateFrameResult(t, s);
        if (res) total += res.subtotal;
      }
      total += (gameState.rerollPenalties[t] || 0);
      results.push({ teamIdx: t, name: teamNames[t] || `チーム${t + 1}`, score: Math.round(total) });
    }

    results.sort((a, b) => b.score - a.score);

    let html = "";
    results.forEach((res, rank) => {
      const isWinner = rank === 0;
      let diffText = "";
      if (rank > 0) {
        const diff = results[0].score - res.score;
        diffText = `<span class="display-diff-badge">首位差 -${diff}pt</span>`;
      }

      html += `
        <div class="display-rank-item ${isWinner ? 'winner' : ''}">
          <div>
            <span>${rank + 1}位: ${res.name}</span>
            ${diffText}
          </div>
          <div style="color:var(--accent-yellow);">${res.score} 点</div>
        </div>
      `;
    });

    container.innerHTML = html;
  }

  function openResultModal() {
    renderRankingsToElement("result-body");
    openModal("result-modal");
  }

  function openBreakdownModal() {
    const container = document.getElementById("breakdown-body");
    const { teamCount, songCount, teamNames } = gameState.settings;

    let html = "";
    for (let t = 0; t < teamCount; t++) {
      const name = teamNames[t] || `チーム${t + 1}`;
      let totalRaw = 0;
      let teamTotal = 0;

      html += `<div style="font-weight:bold; color:var(--accent-yellow); margin-top:8px;">■ ${name}</div>`;
      html += `<table class="breakdown-table"><thead><tr><th>曲</th><th>条件</th><th>素点</th><th>平均</th><th>判定</th><th>小計</th></tr></thead><tbody>`;

      for (let s = 0; s < songCount; s++) {
        const data = gameState.scores[t][s];
        const res = calculateFrameResult(t, s);
        const eff = getEffectiveCondition(t, s);

        if (data && res) {
          totalRaw += data.rawScore;
          teamTotal += res.subtotal;
          html += `<tr><td>${s + 1}</td><td>${eff ? eff.text : '-'}</td><td>${res.rawScore}</td><td>${res.avgScore}</td><td>${res.mark}</td><td><b>${Math.round(res.subtotal)}</b></td></tr>`;
        } else {
          html += `<tr><td>${s + 1}</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td></tr>`;
        }
      }

      const penalty = gameState.rerollPenalties[t] || 0;
      html += `</tbody></table>`;
      html += `<div style="font-size:0.75rem; margin-top:4px;">ペナルティ: ${penalty}pt / 最終合計: <b>${Math.round(teamTotal + penalty)}pt</b></div>`;
    }

    container.innerHTML = html;
    openModal("breakdown-modal");
  }

  function openModal(id) { document.getElementById(id).classList.add("active"); }
  function closeModal(id) { document.getElementById(id).classList.remove("active"); }
</script>
</body>
</html>
