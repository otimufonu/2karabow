<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>目隠しバトルステージ - カラオケボウリング</title>
  <style>
    /* ==========================================
       1. 基本設定・危険/バトルステージテーマ（CSS）
       ========================================== */
    :root {
      --bg-color: #07080a;
      --card-bg: #12141c;
      --panel-bg: #1a1d28;
      --danger-red: #ff1744;
      --danger-dark: #8f001a;
      --warning-yellow: #ffea00;
      --accent-cyan: #00e5ff;
      --text-main: #ffffff;
      --text-sub: #90a4ae;
      --border-color: #2c3245;
      --btn-active-scale: 0.96;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 危険な雰囲気のハザード背景・光彩エフェクト */
    #battle-app {
      width: 100%;
      max-width: 900px;
      height: 100%;
      max-height: 700px;
      background: radial-gradient(circle at center, #1a080d 0%, #07080a 100%);
      border: 2px solid var(--danger-red);
      box-shadow: 0 0 30px rgba(255, 23, 68, 0.3), inset 0 0 15px rgba(255, 23, 68, 0.2);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 上部ヘッダー */
    header {
      height: 50px;
      background: linear-gradient(180deg, #2b050d 0%, #120205 100%);
      border-bottom: 2px solid var(--danger-red);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--danger-red);
      text-shadow: 0 0 8px rgba(255, 23, 68, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stage-badge {
      background: var(--danger-red);
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }

    /* メインコンテンツエリア */
    main {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-y: auto;
    }

    /* 各画面共通パネル */
    .view-panel {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      animation: fadeIn 0.25s ease-out forwards;
    }

    .view-panel.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    /* テキスト・見出しスタイル */
    .player-label {
      font-size: 1.2rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .player-name {
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 900;
      color: var(--warning-yellow);
      text-shadow: 0 0 10px rgba(255, 234, 0, 0.4);
      margin-bottom: 12px;
    }

    .warning-box {
      background: rgba(143, 0, 26, 0.3);
      border: 2px dashed var(--danger-red);
      border-radius: 12px;
      padding: 20px;
      margin: 16px 0;
      width: 100%;
      max-width: 550px;
    }

    .warning-text {
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      font-weight: bold;
      color: #fff;
      line-height: 1.8;
    }

    /* 巨大ミスカウンター表示 */
    .counter-wrapper {
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 32px;
      width: 100%;
      max-width: 420px;
      margin: 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
    }

    .counter-title {
      font-size: 1.1rem;
      color: var(--text-sub);
      font-weight: bold;
      letter-spacing: 1px;
    }

    .counter-value {
      font-size: clamp(4.5rem, 12vw, 7rem);
      font-weight: 900;
      color: var(--danger-red);
      text-shadow: 0 0 20px rgba(255, 23, 68, 0.8);
      line-height: 1;
      margin: 8px 0;
    }

    /* ボタンデザイン */
    .btn-container {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 500px;
      justify-content: center;
    }

    .btn {
      background: var(--panel-bg);
      color: var(--text-main);
      border: 2px solid var(--border-color);
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s, border-color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }

    .btn:active {
      transform: scale(var(--btn-active-scale));
    }

    .btn-danger-huge {
      background: linear-gradient(135deg, var(--danger-red) 0%, var(--danger-dark) 100%);
      border-color: #ff5252;
      color: #ffffff;
      font-size: clamp(1.4rem, 3.5vw, 2rem);
      font-weight: 900;
      padding: 20px;
      flex: 2;
      box-shadow: 0 6px 20px rgba(255, 23, 68, 0.4);
    }

    .btn-undo {
      background: #2a3142;
      border-color: #455a64;
      color: #cfd8dc;
      font-size: 1.1rem;
      flex: 1;
    }

    .btn-finish {
      background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
      border-color: #4caf50;
      color: #fff;
      width: 100%;
      max-width: 500px;
      padding: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      margin-top: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0288d1 0%, #01579b 100%);
      border-color: var(--accent-cyan);
      color: #fff;
      padding: 16px 32px;
      font-size: 1.2rem;
    }

    /* フォーム制御（曲後入力） */
    .form-container {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 12px;
      text-align: left;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: bold;
    }

    .form-control {
      background: #090a0f;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 1.1rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--danger-red);
    }

    /* 結果カード・テーブル表示 */
    .result-card {
      background: rgba(18, 20, 28, 0.9);
      border: 2px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      margin: 12px 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .final-score-val {
      font-size: clamp(3.5rem, 8vw, 5.5rem);
      font-weight: 900;
      color: var(--accent-cyan);
      text-shadow: 0 0 15px rgba(0, 229, 255, 0.6);
      margin: 8px 0;
    }

    .breakdown-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
      margin-top: 12px;
      font-size: 0.95rem;
      text-align: left;
    }

    .breakdown-item {
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
    }

    .breakdown-item span.val {
      color: var(--text-main);
      font-weight: bold;
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    .summary-table th, .summary-table td {
      border: 1px solid var(--border-color);
      padding: 10px 8px;
      text-align: center;
      font-size: 0.9rem;
    }

    .summary-table th {
      background: var(--panel-bg);
      color: var(--text-sub);
    }

    .summary-table td.rank-1 {
      color: var(--warning-yellow);
      font-weight: bold;
      font-size: 1.1rem;
    }

    /* レスポンシブ調整 */
    @media (max-width: 600px) {
      #battle-app { border: none; border-radius: 0; }
      .counter-wrapper { padding: 10px 16px; }
      .btn-danger-huge { padding: 14px; }
    }
  </style>
</head>
<body>

<div id="battle-app">
  <!-- ヘッダー -->
  <header>
    <div class="header-title">
      ⚠️ BATTLE STAGE ⚠️
    </div>
    <div class="stage-badge">目隠し</div>
  </header>

  <main>
    <!-- 画面1: 曲開始前 (START) -->
    <div id="view-start" class="view-panel active">
      <div>
        <div class="player-label">CURRENT PLAYER</div>
        <div id="start-player-name" class="player-name">PLAYER NAME</div>
      </div>

      <div class="warning-box">
        <p class="warning-text">歌詞を見るな。</p>
        <p class="warning-text">曲を最後まで歌え。</p>
        <p class="warning-text" style="color: var(--warning-yellow); font-size: 1rem; margin-top: 8px;">
          ※ミスは相手プレイヤーがPCでカウントします
        </p>
      </div>

      <button class="btn btn-primary" style="width: 100%; max-width: 400px; font-weight: 900;" onclick="startSongCount()">
        スタート
      </button>
    </div>

    <!-- 画面2: 曲中 カウント画面 (COUNT) -->
    <div id="view-count" class="view-panel">
      <div>
        <div class="player-label">歌唱中: <span id="count-player-name" style="color: var(--warning-yellow); font-weight: bold;">-</span></div>
      </div>

      <div class="counter-wrapper">
        <div class="counter-title">歌詞ミス</div>
        <div id="count-mistakes-val" class="counter-value">0</div>
      </div>

      <div class="btn-container">
        <button class="btn btn-danger-huge" onclick="addMistake(1)">
          ミス +1
        </button>
        <button class="btn btn-undo" onclick="addMistake(-1)">
          取り消し
        </button>
      </div>

      <button class="btn btn-finish" onclick="confirmFinishSong()">
        曲終了
      </button>
    </div>

    <!-- 画面3: 曲終了後のスコア入力画面 (INPUT) -->
    <div id="view-input" class="view-panel">
      <div style="width: 100%; max-width: 450px; text-align: center;">
        <div class="player-label">スコア入力</div>
        <div id="input-player-name" class="player-name" style="font-size: 1.8rem; margin-bottom: 8px;">-</div>
      </div>

      <div class="form-container">
        <div class="form-group">
          <label for="input-song-title">曲名</label>
          <input type="text" id="input-song-title" class="form-control" placeholder="例: 残響散歌">
        </div>
        <div class="form-group">
          <label for="input-raw-score">素点</label>
          <input type="number" step="0.001" id="input-raw-score" class="form-control" placeholder="87.4" value="87.4">
        </div>
        <div class="form-group">
          <label for="input-avg-score">平均点</label>
          <input type="number" step="0.001" id="input-avg-score" class="form-control" placeholder="79.4" value="79.4">
        </div>
      </div>

      <button class="btn btn-primary" style="width: 100%; max-width: 450px; font-weight: 900;" onclick="submitPlayerResult()">
        結果を見る
      </button>
    </div>

    <!-- 画面4: プレイヤーごとの結果表示画面 (PLAYER RESULT) -->
    <div id="view-player-result" class="view-panel">
      <div>
        <div id="res-player-name" class="player-name">PLAYER 1</div>
        <div class="player-label" style="letter-spacing: 2px;">FINAL SCORE</div>
      </div>

      <div class="result-card">
        <div id="res-final-total" class="final-score-val">0.0</div>
        
        <div class="breakdown-list">
          <div class="breakdown-item">
            <span>目隠しバトルスコア:</span>
            <span id="res-battle-score" class="val">0.0</span>
          </div>
          <div class="breakdown-item" style="font-size: 0.85rem; padding-left: 10px;">
            <span>└ 素点:</span>
            <span id="res-raw-score" class="val">0.0</span>
          </div>
          <div class="breakdown-item" style="font-size: 0.85rem; padding-left: 10px;">
            <span>└ 平均差:</span>
            <span id="res-avg-diff" class="val">+0.0</span>
          </div>
          <div class="breakdown-item" style="font-size: 0.85rem; padding-left: 10px;">
            <span>└ 特殊ボーナス/ペナルティ (Modifier):</span>
            <span id="res-modifier" class="val">+0</span>
          </div>
          <div class="breakdown-item" id="res-prev-bonus-row" style="display: none; color: var(--warning-yellow);">
            <span>直前レーンボーナス加算:</span>
            <span id="res-prev-bonus" class="val">+0.0</span>
          </div>
        </div>
      </div>

      <button id="btn-next-player" class="btn btn-primary" style="width: 100%; max-width: 400px; font-weight: 900;" onclick="proceedNextPlayer()">
        次のプレイヤーへ
      </button>
    </div>

    <!-- 画面5: 全プレイヤー終了後 全体結果画面 (FINAL SUMMARY) -->
    <div id="view-final-summary" class="view-panel">
      <div>
        <div class="player-label">ALL PLAYERS FINISHED</div>
        <div class="player-name" style="color: var(--danger-red);">最終結果一覧</div>
      </div>

      <div style="width: 100%; max-width: 650px; overflow-x: auto;">
        <table class="summary-table">
          <thead>
            <tr>
              <th>順位</th>
              <th>プレイヤー</th>
              <th>素点</th>
              <th>平均差</th>
              <th>ミス</th>
              <th>Battle</th>
              <th>最終合計</th>
            </tr>
          </thead>
          <tbody id="summary-tbody">
            <!-- JSで動的生成 -->
          </tbody>
        </table>
      </div>

      <button class="btn btn-primary" style="width: 100%; max-width: 400px; font-weight: 900; background: linear-gradient(135deg, #2e7d32, #1b5e20);" onclick="finishAllBattlesAndReturn()">
        結果を確定してメインへ戻る
      </button>
    </div>
  </main>
</div>

<script>
  /* ==========================================
     2. Web Audio API によるビープ音生成
     ========================================== */
  let audioCtx = null;

  function playBeepSound() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime); // 880Hz (A5)

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    } catch (e) {
      console.warn("Web Audio API Error:", e);
    }
  }

  /* ==========================================
     3. 将来の拡張性を考慮したステージ定義
     ========================================== */
  const battleStages = {
    mekakushi: {
      id: "mekakushi",
      name: "目隠し",
      calculateModifier: function(mistakes) {
        // 仕様要件 9:
        // 0回 → +10
        // 1回以上 → -mistakes
        if (mistakes === 0) {
          return 10;
        } else {
          return -mistakes;
        }
      },
      calculateBattleScore: function(rawScore, avgScore, mistakes) {
        const averageDifference = rawScore - avgScore;
        const battleModifier = this.calculateModifier(mistakes);
        const battleScore = rawScore + averageDifference + battleModifier;
        return {
          averageDifference: averageDifference,
          battleModifier: battleModifier,
          battleScore: battleScore
        };
      }
    }
  };

  /* ==========================================
     4. アプリケーション状態管理
     ========================================== */
  const BATTLE_DATA_KEY = "karaokeBowlingBattleData";
  const BATTLE_RESULT_KEY = "karaokeBowlingBattleResult";
  const MAIN_GAME_DATA_KEY = "KARAOKE_BOWLING_DATA_V1";

  let sessionState = {
    players: [],         // 入力・正規化済みプレイヤー一覧
    currentIndex: 0,     // 現在操作中のプレイヤーインデックス
    currentMistakes: 0,  // 現在歌唱中のミス回数
    results: []          // 各プレイヤーの計算結果保持
  };

  // 画面起動時のデータ読み込み
  window.addEventListener("DOMContentLoaded", () => {
    loadInputData();
    initPlayerView();
  });

  // index.html または localStorage からデータ受領
  function loadInputData() {
    const rawData = localStorage.getItem(BATTLE_DATA_KEY);
    let loadedPayload = null;

    if (rawData) {
      try {
        loadedPayload = JSON.parse(rawData);
      } catch (e) {
        console.error("バトルデータのパースに失敗しました:", e);
      }
    }

    // データが存在しない場合のテスト用デフォルトデータ（単体動作保証）
    if (!loadedPayload || !loadedPayload.players || loadedPayload.players.length === 0) {
      loadedPayload = {
        players: [
          {
            name: "PLAYER 1",
            lanes: [
              { rawScore: 88.0, averageScore: 80.0, strike: true, spare: false },
              { rawScore: 82.0, averageScore: 80.0, strike: false, spare: true }
            ]
          },
          {
            name: "PLAYER 2",
            lanes: [
              { rawScore: 85.0, averageScore: 82.0, strike: false, spare: false },
              { rawScore: 90.0, averageScore: 80.0, strike: true, spare: false }
            ]
          }
        ]
      };
    }

    // データ構造の正規化
    sessionState.players = loadedPayload.players.map((p, idx) => {
      const pName = p.playerName || p.name || `PLAYER ${idx + 1}`;
      const lanesRaw = p.lanes || p.history || [];
      
      const lanes = lanesRaw.map(l => ({
        rawScore: parseFloat(l.rawScore) || 0,
        averageScore: parseFloat(l.averageScore) || 0,
        strike: !!l.strike,
        spare: !!l.spare
      }));

      return {
        id: idx,
        playerName: pName,
        lanes: lanes
      };
    });

    sessionState.currentIndex = 0;
    sessionState.results = [];
  }

  /* ==========================================
     5. 画面遷移とUI操作ロジック
     ========================================== */
  function showView(viewId) {
    document.querySelectorAll(".view-panel").forEach(panel => {
      panel.classList.remove("active");
    });
    const target = document.getElementById(viewId);
    if (target) target.classList.add("active");
  }

  function initPlayerView() {
    const player = sessionState.players[sessionState.currentIndex];
    if (!player) {
      showFinalSummary();
      return;
    }

    sessionState.currentMistakes = 0;

    // 画面1（曲開始前）の設定
    document.getElementById("start-player-name").textContent = player.playerName;
    showView("view-start");
  }

  function startSongCount() {
    const player = sessionState.players[sessionState.currentIndex];
    document.getElementById("count-player-name").textContent = player.playerName;
    document.getElementById("count-mistakes-val").textContent = "0";
    sessionState.currentMistakes = 0;
    showView("view-count");
  }

  // ミスカウンターの操作
  function addMistake(amount) {
    if (amount > 0) {
      playBeepSound();
    }
    sessionState.currentMistakes += amount;
    if (sessionState.currentMistakes < 0) {
      sessionState.currentMistakes = 0;
    }
    document.getElementById("count-mistakes-val").textContent = sessionState.currentMistakes;
  }

  function confirmFinishSong() {
    if (confirm("曲を終了してスコア入力へ進みますか？")) {
      const player = sessionState.players[sessionState.currentIndex];
      document.getElementById("input-player-name").textContent = player.playerName;
      document.getElementById("input-song-title").value = "";
      document.getElementById("input-raw-score").value = "87.4";
      document.getElementById("input-avg-score").value = "79.4";
      showView("view-input");
    }
  }

  /* ==========================================
     6. バトルスコア＆最終スコア計算ロジック
     ========================================== */
  function submitPlayerResult() {
    const rawScoreInput = parseFloat(document.getElementById("input-raw-score").value);
    const avgScoreInput = parseFloat(document.getElementById("input-avg-score").value);
    const songTitle = document.getElementById("input-song-title").value.trim() || "（曲名なし）";

    if (isNaN(rawScoreInput) || isNaN(avgScoreInput)) {
      alert("素点と平均点を正しい数値で入力してください。");
      return;
    }

    const player = sessionState.players[sessionState.currentIndex];
    const mistakes = sessionState.currentMistakes;

    // 目隠しステージ計算 (仕様9, 10, 11)
    const stageCalc = battleStages.mekakushi.calculateBattleScore(rawScoreInput, avgScoreInput, mistakes);
    const rawScore = rawScoreInput;
    const averageScore = avgScoreInput;
    const averageDifference = stageCalc.averageDifference;
    const battleModifier = stageCalc.battleModifier;
    const battleScore = stageCalc.battleScore;

    // 通常レーン合計点の算出
    let previousTotal = 0;
    const lanes = player.lanes || [];

    for (let i = 0; i < lanes.length; i++) {
      const l = lanes[i];
      const diff = l.rawScore - l.averageScore;
      let frameScore = l.rawScore + diff;

      // 直前以外の過去フレームに対するストライク/スペア加算
      if (i < lanes.length - 1) {
        const nextL = lanes[i + 1];
        const nextDiff = nextL.rawScore - nextL.averageScore;
        if (l.strike) {
          frameScore += (nextDiff * 2);
        } else if (l.spare) {
          frameScore += (nextDiff * 1);
        }
      }
      previousTotal += frameScore;
    }

    // 直前レーン（最終バトルの直前）のストライク/スペアボーナス計算 (仕様13, 14, 15)
    let previousLaneBonus = 0;
    const previousLane = lanes.length > 0 ? lanes[lanes.length - 1] : null;

    if (previousLane) {
      if (previousLane.strike) {
        // 直前ストライク: 平均差のみを2倍で加算
        previousLaneBonus = averageDifference * 2;
      } else if (previousLane.spare) {
        // 直前スペア: 平均差のみを1倍で加算
        previousLaneBonus = averageDifference * 1;
      }
    }

    // 最終合計スコア (仕様16)
    const finalTotal = previousTotal + previousLaneBonus + battleScore;

    // 結果オブジェクトの生成 (仕様20)
    const resultObj = {
      playerName: player.playerName,
      songTitle: songTitle,
      rawScore: rawScore,
      averageScore: averageScore,
      mistakes: mistakes,
      battleModifier: battleModifier,
      averageDifference: averageDifference,
      battleScore: battleScore,
      previousLaneBonus: previousLaneBonus,
      previousTotal: previousTotal,
      finalTotal: finalTotal
    };

    sessionState.results.push(resultObj);

    // 画面4（プレイヤー結果画面）の表示更新 (仕様18)
    document.getElementById("res-player-name").textContent = resultObj.playerName;
    document.getElementById("res-final-total").textContent = resultObj.finalTotal.toFixed(1);
    document.getElementById("res-battle-score").textContent = resultObj.battleScore.toFixed(1);
    document.getElementById("res-raw-score").textContent = resultObj.rawScore.toFixed(1);
    document.getElementById("res-avg-diff").textContent = (resultObj.averageDifference >= 0 ? "+" : "") + resultObj.averageDifference.toFixed(1);
    document.getElementById("res-modifier").textContent = (resultObj.battleModifier >= 0 ? "+" : "") + resultObj.battleModifier;

    const prevRow = document.getElementById("res-prev-bonus-row");
    if (previousLaneBonus !== 0) {
      prevRow.style.display = "flex";
      document.getElementById("res-prev-bonus").textContent = "+" + previousLaneBonus.toFixed(1);
    } else {
      prevRow.style.display = "none";
    }

    const nextBtn = document.getElementById("btn-next-player");
    if (sessionState.currentIndex < sessionState.players.length - 1) {
      nextBtn.textContent = "次のプレイヤーへ";
    } else {
      nextBtn.textContent = "全結果を確認する";
    }

    showView("view-player-result");
  }

  function proceedNextPlayer() {
    sessionState.currentIndex++;
    if (sessionState.currentIndex < sessionState.players.length) {
      initPlayerView();
    } else {
      showFinalSummary();
    }
  }

  /* ==========================================
     7. 全体結果画面とメインゲーム連携
     ========================================== */
  function showFinalSummary() {
    const tbody = document.getElementById("summary-tbody");
    tbody.innerHTML = "";

    // 最終合計スコア順にソートしたコピーを作成
    const sorted = [...sessionState.results].sort((a, b) => b.finalTotal - a.finalTotal);

    sorted.forEach((res, rank) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="${rank === 0 ? 'rank-1' : ''}">${rank + 1}</td>
        <td style="font-weight: bold;">${escapeHtml(res.playerName)}</td>
        <td>${res.rawScore.toFixed(1)}</td>
        <td>${res.averageDifference >= 0 ? '+' : ''}${res.averageDifference.toFixed(1)}</td>
        <td style="color: var(--danger-red); font-weight: bold;">${res.mistakes}</td>
        <td>${res.battleScore.toFixed(1)}</td>
        <td style="font-weight: 900; color: var(--accent-cyan);">${res.finalTotal.toFixed(1)}</td>
      `;
      tbody.appendChild(tr);
    });

    showView("view-final-summary");
  }

  function finishAllBattlesAndReturn() {
    // localStorageへ最終結果を書き出し (仕様20)
    const exportData = {
      stage: "目隠し",
      results: sessionState.results,
      timestamp: Date.now()
    };

    localStorage.setItem(BATTLE_RESULT_KEY, JSON.stringify(exportData));

    // メインゲーム(index.html)のストレージ書き換え処理（必要に応じて）
    try {
      const mainDataRaw = localStorage.getItem(MAIN_GAME_DATA_KEY);
      if (mainDataRaw) {
        const mainData = JSON.parse(mainDataRaw);
        sessionState.results.forEach((res, idx) => {
          if (mainData.scores && mainData.scores[idx]) {
            const lastSongIdx = mainData.scores[idx].length - 1;
            if (lastSongIdx >= 0) {
              mainData.scores[idx][lastSongIdx] = {
                rawScore: res.rawScore,
                avgScore: res.averageScore,
                title: res.songTitle,
                condition: "【目隠し】"
              };
            }
          }
        });
        localStorage.setItem(MAIN_GAME_DATA_KEY, JSON.stringify(mainData));
      }
    } catch (e) {
      console.warn("メインゲームデータ同期通知:", e);
    }

    alert("目隠しバトルの全結果を確定しました。メインゲームに戻ります。");
    window.location.href = "index.html";
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
</script>
